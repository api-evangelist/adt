reversibility:
  grade: unknown
  write_surface: unknown
  reversal_operations: []
  detail: >-
    ADT's consumer product plainly has consequential write actions — arming and disarming a
    security system, issuing and revoking access codes, unlocking a door — and reversibility
    is exactly what an agent would need to know before taking one. But ADT publishes no API
    contract, so no reversal operation and no reversal window can be cited. Deliberately
    graded `unknown`, not `na` (the surface is not read-only) and not `documented` (nothing
    is documented). NO window is asserted, because inventing one here could cost someone
    their physical security.
