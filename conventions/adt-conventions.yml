method: probed
source: >-
  Probes of api.adt.com, auth.adt.com, www.adt.com and help.adt.com, plus a search for an
  ADT developer reference. No ADT API reference exists to read cross-cutting semantics from.
provider: ADT
providerId: adt
applicability: >-
  ADT publishes no developer API contract, so every runtime convention below is UNKNOWN
  rather than absent. Nothing here is derived from openapi/, because those documents were
  authored by API Evangelist (see openapi/_ae-authored/README.md) and their conventions are
  ours, not ADT's — recording them here would present our design choices as ADT's behaviour.
auth_style:
  known: true
  style: oauth2 / openIdConnect (customer identity only)
  detail: >-
    https://auth.adt.com/.well-known/openid-configuration — authorization code, DPoP-capable,
    private_key_jwt permitted. This authenticates ADT customers into ADT's own portal; it is
    not documented as a developer-API authorization server.
  source: well-known/adt-openid-configuration.json
